[binaries]
c     = 'arm-none-eabi-gcc'
cpp   = 'arm-none-eabi-g++'
ar    = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'
objcopy = 'arm-none-eabi-objcopy'
size  = 'arm-none-eabi-size'

[built-in options]
c_args      = ['-mcpu=cortex-m4', '-mfpu=fpv4-sp-d16', '-mthumb', '-mfloat-abi=hard', '-ffunction-sections', '-fdata-sections', '-fno-common']
cpp_args    = ['-mcpu=cortex-m4', '-mfpu=fpv4-sp-d16', '-mthumb', '-mfloat-abi=hard', '-ffunction-sections', '-fdata-sections', '-fno-common']
c_link_args = ['-mcpu=cortex-m4', '-mfpu=fpv4-sp-d16', '-mthumb', '-mfloat-abi=hard', '--specs=nano.specs', '-nostartfiles', '-Wl,--gc-sections']
cpp_link_args = ['-mcpu=cortex-m4', '-mfpu=fpv4-sp-d16', '-mthumb', '-mfloat-abi=hard', '--specs=nano.specs', '-nostartfiles', '-Wl,--gc-sections']

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'cortex-m4'
endian = 'little'

[properties]
has_fpu=true
